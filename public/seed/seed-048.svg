  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Marta Owusu</text>
  <text x="108" y="72" fill="#65676b" font-size="18">3 hrs · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">We wrote decisions down so a five-person team</tspan><tspan x="36" dy="36">stays aligned.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cash runway math should be boring and</tspan><tspan x="36" dy="36">frequent.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We cut a feature we loved because nobody used</tspan><tspan x="36" dy="36">it.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Runway is a product constraint, not a</tspan><tspan x="36" dy="36">spreadsheet hobby.</tspan></text>
