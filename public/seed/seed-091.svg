  <text x="108" y="72" fill="#00000099" font-size="18">Real Estate Agent | Open to connect</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">We tracked which SKUs sit and which ones turn.</tspan><tspan x="36" dy="36">Ego products lost.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The part dashboards miss is the human</tspan><tspan x="36" dy="36">friction. We trained the team on one upsell</tspan><tspan x="36" dy="36">that feels helpful, not pushy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Your calendar should include recovery, not</tspan><tspan x="36" dy="36">only openings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">That is the update for now.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Ask for the review. Most happy people just</tspan><tspan x="36" dy="36">forget.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I started closing the laptop at 8 so I still</tspan><tspan x="36" dy="36">have a life outside the business.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Systems let you be kind to customers without</tspan><tspan x="36" dy="36">burning out staff.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We tracked which SKUs sit and which ones turn.</tspan><tspan x="36" dy="36">Ego products lost.</tspan></text>
