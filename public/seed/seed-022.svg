  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">Neighborhood meeting ran long and still worth</tspan><tspan x="36" dy="36">it.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Listening to people you disagree with is part</tspan><tspan x="36" dy="36">of living near them.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I volunteered for the unglamorous treasurer</tspan><tspan x="36" dy="36">role. Somebody had to.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Hospitality makes meetings survivable.</tspan></text>
