  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">I am ending the week naming specifics, not</tspan><tspan x="36" dy="36">vibes.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Appreciation is maintenance for relationships.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The night shift left the station ready for us.</tspan><tspan x="36" dy="36">That is love in logistics.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Someone credited my idea in a meeting where I</tspan><tspan x="36" dy="36">was not present.</tspan></text>
