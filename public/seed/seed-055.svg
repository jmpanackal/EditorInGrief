<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">WR</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Wei Rosen</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Director of People · Harbor Education LLC</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">I used to handle this badly. Earplugs and a</tspan><tspan x="36" dy="36">book beat rage-scrolling on the platform.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">What changed is simpler than it sounds. Cities</tspan><tspan x="36" dy="36">feel different when you are not sealed in a</tspan><tspan x="36" dy="36">car.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Systems fail. Personal buffers are kindness to</tspan><tspan x="36" dy="36">yourself.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Sharing in case it helps someone else.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Sleep debt makes every delay feel larger.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Earplugs and a book beat rage-scrolling on the</tspan><tspan x="36" dy="36">platform.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Arrive as a person, not as residual traffic</tspan><tspan x="36" dy="36">stress.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">One unreliable transfer breaks a whole</tspan><tspan x="36" dy="36">morning.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Reliability beats raw speed for daily life.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#00000099" font-size="18">♥ 529   💬 49</text>
  <text x="684" y="1026" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>