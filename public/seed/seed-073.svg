<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1084" viewBox="0 0 720 1084" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1084" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">DV</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Diego Verma</text>
  <text x="108" y="72" fill="#65676b" font-size="18">2 hrs · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">I am learning that kids do not need a perfect</tspan><tspan x="36" dy="36">parent, just a present one.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">They wanted to show me a drawing mid-email.</tspan><tspan x="36" dy="36">The drawing won.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Kids notice what we prioritize, not what we</tspan><tspan x="36" dy="36">post.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We practiced apologizing after I snapped about</tspan><tspan x="36" dy="36">shoes by the door.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Protect one unhurried stretch of the evening.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">They wanted to show me a drawing mid-email.</tspan><tspan x="36" dy="36">The drawing won.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Routines reduce friction more than pep talks</tspan><tspan x="36" dy="36">do.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We are negotiating screen time like it is a</tspan><tspan x="36" dy="36">union contract.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Your calm is a co-regulation tool, not a</tspan><tspan x="36" dy="36">personality trait you either have.</tspan></text>
  <line x1="36" y1="1028" x2="684" y2="1028" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1062" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="1062" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>