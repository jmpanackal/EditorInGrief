<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="832" viewBox="0 0 720 832" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="832" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">FM</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Freya Mensah</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Project Coordinator · Bridge Therapeutics Inc.</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">Kitchen note from someone learning to cook</tspan><tspan x="36" dy="36">without the performance. Here is what helped.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">- Close the loop when it is done.</tspan><tspan x="36" dy="36">- Say the constraint out loud early.</tspan><tspan x="36" dy="36">- Write the decision where others can find it.</tspan><tspan x="36" dy="36">- Trade perfect for finished when the clock is</tspan><tspan x="36" dy="36">real.</tspan><tspan x="36" dy="36">- Protect one block of uninterrupted time.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Feeding people is a love language that still</tspan><tspan x="36" dy="36">needs a grocery list.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Repeat meals are not failure. They are</tspan><tspan x="36" dy="36">systems.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Sharing food with friends fixed a rough week</tspan><tspan x="36" dy="36">more than I expected.</tspan></text>
  <line x1="36" y1="776" x2="684" y2="776" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="810" fill="#00000099" font-size="18">♥ 489   💬 9</text>
  <text x="684" y="810" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>