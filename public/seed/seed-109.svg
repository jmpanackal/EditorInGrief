<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2632" viewBox="0 0 720 2632" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="2632" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1d9bf0"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">LJ</text>
  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Lucia Johnson</text>
  <text x="108" y="72" fill="#536471" font-size="18">@stellaa</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">Caretaking softens a hard week in ways I did</tspan><tspan x="36" dy="36">not expect.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Nail trims go better with peanut butter</tspan><tspan x="36" dy="36">diplomacy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Short training sessions beat long frustrated</tspan><tspan x="36" dy="36">ones.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Play is enrichment, not optional fluff.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Noticing this more lately.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Responsible ownership includes planning for</tspan><tspan x="36" dy="36">hard days.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I scheduled preventative care instead of</tspan><tspan x="36" dy="36">waiting for a scare.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Play is enrichment, not optional fluff.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A neighbor dog meetup became a tiny social</tspan><tspan x="36" dy="36">life for both of us.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Routines are love in animal language.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The cat chose my laptop as a throne during</tspan><tspan x="36" dy="36">every important call.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Outdoor time helps the human as much as the</tspan><tspan x="36" dy="36">pet.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Nail trims go better with peanut butter</tspan><tspan x="36" dy="36">diplomacy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Training is relationship work, not dominance</tspan><tspan x="36" dy="36">theater.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The cat chose my laptop as a throne during</tspan><tspan x="36" dy="36">every important call.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Caretaking softens a hard week.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Pet insurance paperwork is annoying and was</tspan><tspan x="36" dy="36">worth it once.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Training is relationship work, not dominance</tspan><tspan x="36" dy="36">theater.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">She still steals socks. We are negotiating.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Budget for the unexpected. Pets specialize in</tspan><tspan x="36" dy="36">it.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Morning walks force me outside before Slack</tspan><tspan x="36" dy="36">does.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Caretaking softens a hard week.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Nail trims go better with peanut butter</tspan><tspan x="36" dy="36">diplomacy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Responsible ownership includes planning for</tspan><tspan x="36" dy="36">hard days.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The cat chose my laptop as a throne during</tspan><tspan x="36" dy="36">every important call. Preventative care is</tspan><tspan x="36" dy="36">kindness to future you.</tspan></text>
  <line x1="36" y1="2576" x2="684" y2="2576" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="2610" fill="#536471" font-size="18">♥ 430   ↺ 10   💬 10</text>
  <text x="684" y="2610" fill="#1d9bf0" font-size="16" font-weight="600" text-anchor="end">TWITTER</text>
</svg>