  <text x="36" y="146" fill="#1a1a1a" font-size="26"><tspan x="36" dy="0">Breaks are not optional if you want safe care.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Breaks are not optional if you want safe care.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A respiratory therapist taught me a trick that</tspan><tspan x="36" dy="36">saved minutes we needed.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Compassion without staffing is a slogan.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">What would you have done?</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Handoffs are where quality lives or dies.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We celebrated a quiet win that will never make</tspan><tspan x="36" dy="36">a highlight reel.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Near misses deserve attention, not silence.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Supply shortages forced creative but safe</tspan><tspan x="36" dy="36">workarounds.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Plain language is clinical skill.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Breaks are not optional if you want safe care.</tspan></text>
