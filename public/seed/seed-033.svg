<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="616" viewBox="0 0 720 616" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="616" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">MS</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Mason Silva</text>
  <text x="108" y="72" fill="#65676b" font-size="18">Just now · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">We finally fixed the leak that taught us to</tspan><tspan x="36" dy="36">love plumbers.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Get three quotes. The first number is rarely</tspan><tspan x="36" dy="36">the real number.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We negotiated a rent increase with comps and a</tspan><tspan x="36" dy="36">clean payment history.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Preventive maintenance is cheaper than drama.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Curious how others handle this.</tspan></text>
  <line x1="36" y1="560" x2="684" y2="560" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="594" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="594" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>