<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">EM</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Ella Miller</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Girlboss | Freelance Designer at Grove Systems</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">We raised prices carefully and kept the</tspan><tspan x="36" dy="36">regulars who value the work.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Inventory mistakes are expensive teachers.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">- Say the constraint out loud early.</tspan><tspan x="36" dy="36">- Close the loop when it is done.</tspan><tspan x="36" dy="36">- Trade perfect for finished when the clock is</tspan><tspan x="36" dy="36">real.</tspan><tspan x="36" dy="36">- Leave room for a real question.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cash timing can kill a profitable-looking</tspan><tspan x="36" dy="36">month.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">That is the update for now.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A quiet process beats a charismatic scramble.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Inventory mistakes are expensive teachers.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A quiet process beats a charismatic scramble.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I started closing the laptop at 8 so I still</tspan><tspan x="36" dy="36">have a life outside the business.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#00000099" font-size="18">♥ 569   💬 29</text>
  <text x="684" y="1026" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>