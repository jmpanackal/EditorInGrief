  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Ava Nelson</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Girlboss | Founder at Horizon Motors Co.</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">A quiet hotel breakfast beat the bucket-list</tspan><tspan x="36" dy="36">rush.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Write a little so memory has handles later.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We photographed less and talked more about</tspan><tspan x="36" dy="36">what we saw.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Missed a connection and learned how kind</tspan><tspan x="36" dy="36">strangers can be.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Writing it down so I do not forget.</tspan></text>
