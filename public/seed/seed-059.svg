  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">Grading late at night is a choice I am trying</tspan><tspan x="36" dy="36">to make less often.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Grading late at night is a choice I am trying</tspan><tspan x="36" dy="36">to make less often.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Feedback should be usable, not just</tspan><tspan x="36" dy="36">evaluative.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I planned transitions as carefully as the</tspan><tspan x="36" dy="36">content blocks.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Rest makes better teachers than martyrdom</tspan><tspan x="36" dy="36">does.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Professional learning only helped when I tried</tspan><tspan x="36" dy="36">one idea the next day.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Student voice improves the lesson you thought</tspan><tspan x="36" dy="36">was finished.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Grading late at night is a choice I am trying</tspan><tspan x="36" dy="36">to make less often.</tspan></text>
