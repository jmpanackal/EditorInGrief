<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1120" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">MW</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Min Weber</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Girlboss | Founder at Brighton Energy Holdings | Parent | Always learning</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">I started ending Slack days with a shutdown</tspan><tspan x="36" dy="36">ritual.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cameras on is not culture. Clear decisions are</tspan><tspan x="36" dy="36">culture.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Social connection still needs deliberate</tspan><tspan x="36" dy="36">design.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I use a separate browser profile for work to</tspan><tspan x="36" dy="36">reduce context bleed.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A good home setup is a workplace benefit you</tspan><tspan x="36" dy="36">fund yourself if nobody else will.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Timezone math is a real skill.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Default to writing. Meet to decide.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A weekly written plan replaced Monday meeting</tspan><tspan x="36" dy="36">theater.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Document decisions where the work lives.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Walking outside between calls is not optional</tspan><tspan x="36" dy="36">for my brain.</tspan></text>
  <line x1="36" y1="1064" x2="684" y2="1064" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1098" fill="#00000099" font-size="18">♥ 536   💬 56</text>
  <text x="684" y="1098" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>