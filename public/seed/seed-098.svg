<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">IS</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Imani Sato</text>
  <text x="108" y="72" fill="#65676b" font-size="18">Yesterday · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">I got the promotion I almost talked myself out</tspan><tspan x="36" dy="36">of applying for.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Apply anyway. The list is a wish list, not a</tspan><tspan x="36" dy="36">gate.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I am documenting how decisions get made so I</tspan><tspan x="36" dy="36">do not become a bottleneck.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">People already treat me differently in</tspan><tspan x="36" dy="36">meetings, which is weird and informative.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Happy to compare notes.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Imposter feelings are data, not a veto.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The title changes, but the expectations change</tspan><tspan x="36" dy="36">more.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A promotion is a trust transfer. Treat it that</tspan><tspan x="36" dy="36">way.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I am documenting how decisions get made so I</tspan><tspan x="36" dy="36">do not become a bottleneck.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="1026" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>