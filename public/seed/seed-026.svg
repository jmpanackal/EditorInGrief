  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">The dog does not care about my KPIs and that</tspan><tspan x="36" dy="36">is healthy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Pet insurance paperwork is annoying and was</tspan><tspan x="36" dy="36">worth it once.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">She still steals socks. We are negotiating.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Pets teach attention to the present moment.</tspan></text>
