  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">For anyone juggling more than they admit.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I finally salted early and tasted as I went.</tspan><tspan x="36" dy="36">Small revolution.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cleaning as I cook is still a skill I practice</tspan><tspan x="36" dy="36">on purpose.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Food is culture, logistics, and comfort in the</tspan><tspan x="36" dy="36">same bowl.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">— Marta</tspan></text>
