  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">We sorted donations for three hours and barely</tspan><tspan x="36" dy="36">made a dent, which means the need is real.</tspan><tspan x="36" dy="36">Local problems are not abstract. I asked what</tspan><tspan x="36" dy="36">skills were scarce instead of assuming mine</tspan><tspan x="36" dy="36">were. A regular volunteer taught me the</tspan><tspan x="36" dy="36">unglamorous backbone tasks. Quiet week, useful</tspan></text>
