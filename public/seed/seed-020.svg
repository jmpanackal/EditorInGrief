  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">We packed meals and talked less about politics</tspan><tspan x="36" dy="36">than about logistics.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Transportation was the hidden barrier for</tspan><tspan x="36" dy="36">several people trying to help.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">That is all I have tonight.</tspan></text>
