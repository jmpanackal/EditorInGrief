  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Zain Berg</text>
  <text x="108" y="72" fill="#536471" font-size="18">@robin_yoon</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">I am trying to meal prep without turning</tspan><tspan x="36" dy="36">Sundays into a second job.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cleaning as I cook is still a skill I practice</tspan><tspan x="36" dy="36">on purpose.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We kept a running list of "easy wins" meals</tspan><tspan x="36" dy="36">for drained evenings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cooking skill compounds quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Shared meals are infrastructure for</tspan><tspan x="36" dy="36">friendship.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I bought better olive oil and cheaper snacks.</tspan><tspan x="36" dy="36">Priorities.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Feeding people is a love language that still</tspan><tspan x="36" dy="36">needs a grocery list.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We kept a running list of "easy wins" meals</tspan><tspan x="36" dy="36">for drained evenings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Budget and joy can share a kitchen.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A farmers market tomato made a plain sandwich</tspan><tspan x="36" dy="36">feel special.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cooking skill compounds quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We kept a running list of "easy wins" meals</tspan><tspan x="36" dy="36">for drained evenings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Support the places that treat staff and guests</tspan><tspan x="36" dy="36">with care.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A farmers market tomato made a plain sandwich</tspan><tspan x="36" dy="36">feel special.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Shared meals are infrastructure for</tspan><tspan x="36" dy="36">friendship.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cleaning as I cook is still a skill I practice</tspan><tspan x="36" dy="36">on purpose.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Budget and joy can share a kitchen.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Cleaning as I cook is still a skill I practice</tspan><tspan x="36" dy="36">on purpose.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Shared meals are infrastructure for</tspan><tspan x="36" dy="36">friendship.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I prepped onions and sauces on Sunday so</tspan><tspan x="36" dy="36">Tuesday had a chance.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Support the places that treat staff and guests</tspan><tspan x="36" dy="36">with care.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Leftovers got intentional names so they did</tspan><tspan x="36" dy="36">not feel like punishment.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Prep reduces weeknight decision fatigue.</tspan></text>
