<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1228" viewBox="0 0 720 1228" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1228" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">RL</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Riya Liu</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Data Analyst · Stonebridge Insurance Group</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">Sports note: process talk beats scoreboard</tspan><tspan x="36" dy="36">talk after a tough game.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I packed water and snacks like a logistics</tspan><tspan x="36" dy="36">coordinator.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Being a good teammate outlasts any single</tspan><tspan x="36" dy="36">season.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I thanked the refs even when I disagreed. Kids</tspan><tspan x="36" dy="36">were watching.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Teams remember who stayed steady after</tspan><tspan x="36" dy="36">mistakes.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Practice ended with a habit drill that looked</tspan><tspan x="36" dy="36">boring and mattered.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Process over scoreboard when you are</tspan><tspan x="36" dy="36">developing people.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We rotated playing time more fairly and</tspan><tspan x="36" dy="36">chemistry improved.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Joy is a performance factor, not a</tspan><tspan x="36" dy="36">distraction.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I learned the opposing coach's name and the</tspan><tspan x="36" dy="36">tone of the rivalry softened.</tspan></text>
  <line x1="36" y1="1172" x2="684" y2="1172" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1206" fill="#00000099" font-size="18">♥ 599   💬 59</text>
  <text x="684" y="1206" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>