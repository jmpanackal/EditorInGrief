<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1d9bf0"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">TA</text>
  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Tunde Anderson</text>
  <text x="108" y="72" fill="#536471" font-size="18">@riley.clark</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">I used to handle this badly. I photographed</tspan><tspan x="36" dy="36">serial numbers before calling support.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">What changed is simpler than it sounds. I</tspan><tspan x="36" dy="36">scheduled HVAC service before summer panic</tspan><tspan x="36" dy="36">prices.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Neighbors who share tools are a wealth system.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Leaving it here.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Shelter stress is real. Talk about it without</tspan><tspan x="36" dy="36">shame.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Moving boxes still in the garage are a tax on</tspan><tspan x="36" dy="36">calm. We are clearing them.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Know when to hire a licensed pro.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Moisture under the sink was the early warning</tspan><tspan x="36" dy="36">we almost dismissed.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Landlord and tenant conversations go better</tspan><tspan x="36" dy="36">with written facts.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#536471" font-size="18">♥ 540   ↺ 60   💬 60</text>
  <text x="684" y="1026" fill="#1d9bf0" font-size="16" font-weight="600" text-anchor="end">TWITTER</text>
</svg>