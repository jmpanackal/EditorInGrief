<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">HR</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Henry Rodriguez</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Registered Nurse at Redwood Security Co.</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">We gave every dollar a job and the anxiety got</tspan><tspan x="36" dy="36">quieter.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I moved payday transfers to happen</tspan><tspan x="36" dy="36">automatically before I could "decide later."</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Filing this under things I want to remember.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Name the expense before it ambushes you.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We named sinking funds after real events: car</tspan><tspan x="36" dy="36">tires, gifts, travel.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Review subscriptions like you review recurring</tspan><tspan x="36" dy="36">meetings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I cut dining out for two weeks and redirected</tspan><tspan x="36" dy="36">it to the buffer.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A small system you follow beats a perfect</tspan><tspan x="36" dy="36">spreadsheet you abandon.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We track categories weekly, not with guilt,</tspan><tspan x="36" dy="36">just with eyes open.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#00000099" font-size="18">♥ 551   💬 11</text>
  <text x="684" y="1026" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>