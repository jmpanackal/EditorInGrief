<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1d9bf0"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">MH</text>
  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Mai Hall</text>
  <text x="108" y="72" fill="#536471" font-size="18">@snehak</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">Inventory mistakes are expensive teachers.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The part dashboards miss is the human</tspan><tspan x="36" dy="36">friction. Bookkeeping caught a leak we would</tspan><tspan x="36" dy="36">have missed for months.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Systems let you be kind to customers without</tspan><tspan x="36" dy="36">burning out staff.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Curious how others handle this.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Your calendar should include recovery, not</tspan><tspan x="36" dy="36">only openings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A supplier delay forced a menu change</tspan><tspan x="36" dy="36">customers actually liked.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A quiet process beats a charismatic scramble.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We trained the team on one upsell that feels</tspan><tspan x="36" dy="36">helpful, not pushy.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Document the job so the business is not</tspan><tspan x="36" dy="36">trapped in your head.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#536471" font-size="18">♥ 549   ↺ 69   💬 9</text>
  <text x="684" y="1026" fill="#1d9bf0" font-size="16" font-weight="600" text-anchor="end">TWITTER</text>
</svg>