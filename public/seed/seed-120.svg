<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2308" viewBox="0 0 720 2308" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="2308" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">KM</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Kabir Malhotra</text>
  <text x="108" y="72" fill="#65676b" font-size="18">Just now · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">Money update: nothing flashy, just systems</tspan><tspan x="36" dy="36">that work.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Boring money is good money.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We set a fun money line so the budget does not</tspan><tspan x="36" dy="36">feel like punishment.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We set a fun money line so the budget does not</tspan><tspan x="36" dy="36">feel like punishment.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Open to other approaches.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Automation removes decision fatigue where it</tspan><tspan x="36" dy="36">hurts most.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Insurance review found coverage we were paying</tspan><tspan x="36" dy="36">for twice.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Progress is measured in months of calm, not</tspan><tspan x="36" dy="36">viral hacks.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A fee surprise taught us to read statements on</tspan><tspan x="36" dy="36">the first of the month.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Shared goals make shared budgets less</tspan><tspan x="36" dy="36">personal.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I finally logged the cash spending that used</tspan><tspan x="36" dy="36">to vanish from the plan.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Know your fixed costs cold before you chase</tspan><tspan x="36" dy="36">side income.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I cut dining out for two weeks and redirected</tspan><tspan x="36" dy="36">it to the buffer.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Clarity reduces conflict more than frugality</tspan><tspan x="36" dy="36">lectures do.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We named sinking funds after real events: car</tspan><tspan x="36" dy="36">tires, gifts, travel.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Clarity reduces conflict more than frugality</tspan><tspan x="36" dy="36">lectures do.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A fee surprise taught us to read statements on</tspan><tspan x="36" dy="36">the first of the month.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Know your fixed costs cold before you chase</tspan><tspan x="36" dy="36">side income.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I negotiated one bill and found $27 a month we</tspan><tspan x="36" dy="36">were wasting.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A buffer buys options, not just safety.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We named sinking funds after real events: car</tspan><tspan x="36" dy="36">tires, gifts, travel.</tspan></text>
  <line x1="36" y1="2252" x2="684" y2="2252" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="2286" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="2286" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>