  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Kai Lewis</text>
  <text x="108" y="72" fill="#536471" font-size="18">@camila.youssef</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">Packing cubes are not a personality, but they</tspan><tspan x="36" dy="36">helped.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Coming home is part of the trip.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I packed one nicer outfit and felt ready for</tspan><tspan x="36" dy="36">the unexpected dinner.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I wrote three sentences each night so the trip</tspan><tspan x="36" dy="36">would not blur.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Quiet week, useful lesson.</tspan></text>
  <line x1="36" y1="560" x2="684" y2="560" stroke="#00000014" stroke-width="1"/>
