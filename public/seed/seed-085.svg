  <text x="36" y="146" fill="#1a1a1a" font-size="26"><tspan x="36" dy="0">We closed a project that took nine months.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">In Seoul, we kept optimizing a workflow that</tspan><tspan x="36" dy="36">should have been deleted.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Status updates belong in writing. Meetings are</tspan><tspan x="36" dy="36">for decisions.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Noticing this more lately.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A good retro names the system, not the</tspan><tspan x="36" dy="36">scapegoat.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The client was fine. The process was not.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">If you lead, your calendar is a culture</tspan><tspan x="36" dy="36">document.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The client was fine. The process was not.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I am trying to listen longer before I</tspan><tspan x="36" dy="36">problem-solve.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Someone had the answer in a chat from March</tspan><tspan x="36" dy="36">that nobody could find.</tspan></text>
