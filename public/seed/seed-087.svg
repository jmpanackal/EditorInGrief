<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1084" viewBox="0 0 720 1084" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1084" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1d9bf0"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">NH</text>
  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Nora Haddad</text>
  <text x="108" y="72" fill="#536471" font-size="18">@mei.zhou</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">I keep a short thread on this. Trades update:</tspan><tspan x="36" dy="36">apprenticeship is still one of the best career</tspan><tspan x="36" dy="36">paths we underrate.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Measure twice is not a proverb. It is a budget</tspan><tspan x="36" dy="36">saver.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">My note back to the group was basically this.</tspan><tspan x="36" dy="36">Communication is part of the craft.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Noticing this more lately.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Pride in neat work is a professional</tspan><tspan x="36" dy="36">advantage.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The customer cared about cleanliness as much</tspan><tspan x="36" dy="36">as the repair.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Skill scarcity is real. Treat craftspeople</tspan><tspan x="36" dy="36">well.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Good mentors in the trades change lives</tspan><tspan x="36" dy="36">quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Honest pricing builds long relationships.</tspan></text>
  <line x1="36" y1="1028" x2="684" y2="1028" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1062" fill="#536471" font-size="18">♥ 532   ↺ 52   💬 52</text>
  <text x="684" y="1062" fill="#1d9bf0" font-size="16" font-weight="600" text-anchor="end">TWITTER</text>
</svg>