  <text x="108" y="72" fill="#00000099" font-size="18">Content Strategist at Bridge Partners Group | Parent | Always learning</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">I practiced saying no to plans without writing</tspan><tspan x="36" dy="36">an essay.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We revisited a childhood place and it felt</tspan><tspan x="36" dy="36">smaller and sweeter.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The group chat got a shared calendar and</tspan><tspan x="36" dy="36">arguments dropped.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Family health includes emotional maintenance.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Working on it.</tspan></text>
