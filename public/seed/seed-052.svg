<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1084" viewBox="0 0 720 1084" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1084" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">AF</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Adam Farouk</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Dental Hygienist at Unity Hospice Care | Parent | Always learning</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">I keep a short thread on this. I finally used</tspan><tspan x="36" dy="36">my PTO without apologizing for existing.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I covered a colleague's break and they covered</tspan><tspan x="36" dy="36">mine later. Reciprocity matters.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">My note back to the group was basically this.</tspan><tspan x="36" dy="36">Safety is a team sport.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Leaving it here.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Say thank you to the people who keep the floor</tspan><tspan x="36" dy="36">moving.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Breaks are not optional if you want safe care.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Compassion without staffing is a slogan.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Supply shortages forced creative but safe</tspan><tspan x="36" dy="36">workarounds.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Celebrate the quiet saves.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I double-checked an order and caught a near</tspan><tspan x="36" dy="36">miss.</tspan></text>
  <line x1="36" y1="1028" x2="684" y2="1028" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1062" fill="#00000099" font-size="18">♥ 538   💬 58</text>
  <text x="684" y="1062" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>