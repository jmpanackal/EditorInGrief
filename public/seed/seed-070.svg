<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">ST</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Samuel Tran</text>
  <text x="108" y="72" fill="#65676b" font-size="18">1 d · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">Small business owners: the admin work is the</tspan><tspan x="36" dy="36">job sometimes.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We tracked which SKUs sit and which ones turn.</tspan><tspan x="36" dy="36">Ego products lost.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Working on it.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Hire for trust and train for skill when you</tspan><tspan x="36" dy="36">can.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We posted hours clearly and reduced the "are</tspan><tspan x="36" dy="36">you open" texts.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">A quiet process beats a charismatic scramble.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">The first hire needed clearer SOPs than I</tspan><tspan x="36" dy="36">thought I had.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Your calendar should include recovery, not</tspan><tspan x="36" dy="36">only openings.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I batch admin on Wednesdays so the rest of the</tspan><tspan x="36" dy="36">week can be customer-facing.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="1026" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>