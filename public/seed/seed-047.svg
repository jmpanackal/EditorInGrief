  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">After three years on this team, I am taking</tspan><tspan x="36" dy="36">the next step. Celebrating publicly still</tspan><tspan x="36" dy="36">feels awkward, but hiding it helps no one. I</tspan><tspan x="36" dy="36">am inheriting a backlog that needs triage, not</tspan><tspan x="36" dy="36">heroics. The team needs steadiness more than a</tspan><tspan x="36" dy="36">new slogan. That is all</tspan></text>
