<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2596" viewBox="0 0 720 2596" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="2596" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1877f2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">ZC</text>
  <text x="108" y="42" fill="#050505" font-size="24" font-weight="700">Zuri Cho</text>
  <text x="108" y="72" fill="#65676b" font-size="18">1 d · 🌎 Public</text>
  <text x="36" y="146" fill="#050505" font-size="26"><tspan x="36" dy="0">Classroom management is relationship work</tspan><tspan x="36" dy="36">wearing a schedule.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Rest makes better teachers than martyrdom</tspan><tspan x="36" dy="36">does.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I planned transitions as carefully as the</tspan><tspan x="36" dy="36">content blocks.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Professional learning only helped when I tried</tspan><tspan x="36" dy="36">one idea the next day.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Clarity is kindness.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Classroom management is relationship work</tspan><tspan x="36" dy="36">wearing a schedule.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Student voice improves the lesson you thought</tspan><tspan x="36" dy="36">was finished.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Student work on the walls changed the room's</tspan><tspan x="36" dy="36">ownership feel.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Feedback should be usable, not just</tspan><tspan x="36" dy="36">evaluative.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Exit tickets told me what the lesson actually</tspan><tspan x="36" dy="36">taught.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Curiosity is contagious when adults model it.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Classroom management is relationship work</tspan><tspan x="36" dy="36">wearing a schedule.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Relationships unlock learning more than new</tspan><tspan x="36" dy="36">tech does.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I called home with a positive note before any</tspan><tspan x="36" dy="36">problem appeared.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Partner with families early, not only in</tspan><tspan x="36" dy="36">crisis.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I differentiated by offering choice, not by</tspan><tspan x="36" dy="36">lowering the bar quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Clarity is kindness.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I differentiated by offering choice, not by</tspan><tspan x="36" dy="36">lowering the bar quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Routines free cognitive space for thinking.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I called home with a positive note before any</tspan><tspan x="36" dy="36">problem appeared.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Public education runs on people who stay.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I greeted students at the door and the first</tspan><tspan x="36" dy="36">five minutes calmed down.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Rest makes better teachers than martyrdom</tspan><tspan x="36" dy="36">does.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Student work on the walls changed the room's</tspan><tspan x="36" dy="36">ownership feel. Rest makes better teachers</tspan><tspan x="36" dy="36">than martyrdom does.</tspan></text>
  <line x1="36" y1="2540" x2="684" y2="2540" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="2574" fill="#65676b" font-size="18">Like · Comment · Share</text>
  <text x="684" y="2574" fill="#1877f2" font-size="16" font-weight="600" text-anchor="end">FACEBOOK</text>
</svg>