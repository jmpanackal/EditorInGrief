<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="580" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#0a66c2"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">JA</text>
  <text x="108" y="42" fill="#000000c9" font-size="24" font-weight="700">Jamie Allen</text>
  <text x="108" y="72" fill="#00000099" font-size="18">Nurse Educator at Fairview Networks Holdings</text>
  <text x="36" y="146" fill="#000000d9" font-size="26"><tspan x="36" dy="0">I used to handle this badly. I differentiated</tspan><tspan x="36" dy="36">by offering choice, not by lowering the bar</tspan><tspan x="36" dy="36">quietly.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">What changed is simpler than it sounds.</tspan><tspan x="36" dy="36">Classroom management is relationship work</tspan><tspan x="36" dy="36">wearing a schedule.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Clarity is kindness.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">That is the update for now.</tspan></text>
  <line x1="36" y1="524" x2="684" y2="524" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="558" fill="#00000099" font-size="18">♥ 253   💬 13</text>
  <text x="684" y="558" fill="#0a66c2" font-size="16" font-weight="600" text-anchor="end">LINKEDIN</text>
</svg>