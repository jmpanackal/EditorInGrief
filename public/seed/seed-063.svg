<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="1048" fill="#ffffff"/>
  
  <circle cx="64" cy="56" r="28" fill="#1d9bf0"/>
  <text x="64" y="56" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">FJ</text>
  <text x="108" y="42" fill="#0f1419" font-size="24" font-weight="700">Folake Jackson</text>
  <text x="108" y="72" fill="#536471" font-size="18">@ananya.novak</text>
  <text x="36" y="146" fill="#0f1419" font-size="26"><tspan x="36" dy="0">I asked customers what "good" looks like</tspan><tspan x="36" dy="36">instead of guessing.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Someone wrote, "Is this urgent or just loud?"</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I answered with the messy truth. I called</tspan><tspan x="36" dy="36">instead of emailing when the situation was</tspan><tspan x="36" dy="36">emotional.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Frontline people know the roadmap gaps first.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Maybe obvious. Still true for me.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Silence is a product decision, whether you</tspan><tspan x="36" dy="36">intend it or not.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">We published status updates before people had</tspan><tspan x="36" dy="36">to ask.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">Customers forgive mistakes. They remember how</tspan><tspan x="36" dy="36">you handled them.</tspan><tspan x="36" dy="36"> </tspan><tspan x="36" dy="36">I read five lost customers' last messages and</tspan><tspan x="36" dy="36">found a pattern.</tspan></text>
  <line x1="36" y1="992" x2="684" y2="992" stroke="#00000014" stroke-width="1"/>
  <text x="36" y="1026" fill="#536471" font-size="18">♥ 534   ↺ 54   💬 54</text>
  <text x="684" y="1026" fill="#1d9bf0" font-size="16" font-weight="600" text-anchor="end">TWITTER</text>
</svg>